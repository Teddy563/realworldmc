plugins {
	id 'fabric-loom' version "${loom_version}"
}

base {
	archivesName = "realworldmc"
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"realworldmc" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

repositories {
    maven {
        url "https://chocolateminecraft.com/maven"
        name "Xaero's Maven"
    }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modCompileOnly "xaero.minimap:xaerominimap-fabric-1.21.1:26.6.0"
    modCompileOnly "xaero.map:xaeroworldmap-fabric-1.21.1:1.47.0"
    def xaero = providers.gradleProperty("xaeroTestSet").getOrElse("none")
    if (xaero in ["both", "minimap"]) modRuntimeOnly "xaero.minimap:xaerominimap-fabric-1.21.1:26.6.0"
    if (xaero in ["both", "worldmap"]) modRuntimeOnly "xaero.map:xaeroworldmap-fabric-1.21.1:1.47.0"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

tasks.named('jar') {
	from('../LICENSE')
	from('../NOTICE')
	from('../LICENSES') { into 'LICENSES' }
}

sourceSets {
    main { java.srcDir '../shared/src/main/java' }
	checks {
        java.srcDir '../shared/src/checks/java'
		compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
		runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
	}
}
tasks.register('streetNavigationChecks', JavaExec) {
	dependsOn tasks.named('checksClasses')
	classpath = sourceSets.checks.runtimeClasspath
	mainClass = 'dev.realworldmc.StreetNavigationChecks'
}
tasks.named('check') { dependsOn tasks.named('streetNavigationChecks') }
tasks.register('meshCutChecks', JavaExec) {
    dependsOn tasks.named('checksClasses')
    classpath = sourceSets.checks.runtimeClasspath
    mainClass = 'dev.realworldmc.MeshCutChecks'
}
tasks.named('check') { dependsOn tasks.named('meshCutChecks') }
tasks.register('setupChecks', JavaExec) {
    dependsOn tasks.named('checksClasses')
    classpath = sourceSets.checks.runtimeClasspath
    mainClass = 'dev.realworldmc.SetupChecks'
}
tasks.named('check') { dependsOn tasks.named('setupChecks') }
tasks.register('serviceRuntimeChecks', JavaExec) {
    dependsOn tasks.named('checksClasses')
    classpath = sourceSets.checks.runtimeClasspath
    mainClass = 'dev.realworldmc.ServiceRuntimeChecks'
}
tasks.named('check') { dependsOn tasks.named('serviceRuntimeChecks') }
tasks.register('bundledServiceChecks', JavaExec) {
    dependsOn tasks.named('checksClasses')
    classpath = sourceSets.checks.runtimeClasspath
    mainClass = 'dev.realworldmc.BundledServiceChecks'
}
tasks.named('check') { dependsOn tasks.named('bundledServiceChecks') }
tasks.register('standaloneJarChecks', JavaExec) {
    dependsOn tasks.named('checksClasses')
    doFirst { if (!project.hasProperty('releaseJar')) throw new GradleException('Pass -PreleaseJar=path/to/release.jar') }
    classpath = files(project.findProperty('releaseJar') ?: 'missing.jar') + sourceSets.checks.runtimeClasspath
    mainClass = 'dev.realworldmc.BundledServiceChecks'
    args 'release'
    environment 'PATH', '' // Release check must use bundled Node, never the developer's Node.
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = 'realworldmc-gametest'
		enableGameTests = true
		enableClientGameTests = false
	}
}

// Isolated client rendering checks. No check classes or mods enter the release JAR.
sourceSets {
    main { java.srcDir '../shared/src/main/java' }
    clientcheck {
        compileClasspath += sourceSets.client.compileClasspath + sourceSets.client.output + sourceSets.main.output
        runtimeClasspath += sourceSets.client.runtimeClasspath + sourceSets.client.output + sourceSets.main.output
    }
}
loom {
    mods { 'realworldmc-clientcheck' { sourceSet sourceSets.clientcheck } }
    runs {
        photoCheck {
            client()
            source sourceSets.clientcheck
            runDir 'run-photo-check'
            vmArg '-Drealworldmc.photoCheck=true'
            programArg '--width'
            programArg '256'
            programArg '--height'
            programArg '256'
        }
    }
}
if (project.hasProperty('photoModDir')) {
    dependencies {
        modRuntimeOnly fileTree(dir: project.property('photoModDir'), includes: ['iris-*.jar', 'sodium-fabric-*.jar'])
    }
}
// Optional local compatibility fixture; these mods never enter a release artifact.
if (project.hasProperty('photoExtraModDir')) {
    dependencies { modRuntimeOnly fileTree(dir: project.property('photoExtraModDir'), includes: ['*.jar']) }
}

tasks.register('clientCheckJar', Jar) {
    archiveClassifier = 'clientcheck-dev'
    from sourceSets.clientcheck.output
}
tasks.register('remapClientCheckJar', net.fabricmc.loom.task.RemapJarTask) {
    dependsOn tasks.named('clientCheckJar')
    inputFile = tasks.named('clientCheckJar', Jar).flatMap { it.archiveFile }
    archiveClassifier = 'clientcheck'
    addNestedDependencies = false
}

tasks.register('spawnLocationChecks', JavaExec) {
    dependsOn tasks.named('checksClasses')
    classpath = sourceSets.checks.runtimeClasspath
    mainClass = 'dev.realworldmc.SpawnLocationChecks'
}
tasks.named('check') { dependsOn tasks.named('spawnLocationChecks') }

tasks.register('nodeRuntimeChecks', JavaExec) {
    dependsOn tasks.named('checksClasses')
    classpath = sourceSets.checks.runtimeClasspath
    mainClass = 'dev.realworldmc.NodeRuntimeChecks'
}
tasks.named('check') { dependsOn tasks.named('nodeRuntimeChecks') }

// Offline integrated-client flight check. Never packages the test entrypoint or world.
loom.runs {
    creativeFlightCheck {
        client()
        source sourceSets.clientcheck
        runDir 'run-flight-check'
        vmArg '-Drealworldmc.creativeFlightCheck=true'
        programArg '--width'
        programArg '640'
        programArg '--height'
        programArg '480'
    }
}
tasks.named('runCreativeFlightCheck') {
    dependsOn tasks.named('runGameTest')
    doFirst {
        delete layout.projectDirectory.file('run-flight-check/creative-flight-result.txt')
        copy {
            from layout.buildDirectory.dir('run/gameTest/world')
            into layout.projectDirectory.dir('run-flight-check/saves/creative-flight-check')
        }
    }
    doLast {
        def result = layout.projectDirectory.file('run-flight-check/creative-flight-result.txt').asFile
        if (!result.exists() || !result.text.startsWith('PASS:')) throw new GradleException(result.exists() ? result.text : 'Flight check did not finish')
    }
}
tasks.register('mapOverlayChecks', JavaExec) {
    dependsOn tasks.named('checksClasses')
    classpath = sourceSets.checks.runtimeClasspath
    mainClass = 'dev.realworldmc.MapOverlayChecks'
}
tasks.named('check') { dependsOn tasks.named('mapOverlayChecks') }
loom.runs {
    mapClientCheck {
        client()
        source sourceSets.clientcheck
        runDir "run-map-check-${providers.gradleProperty('xaeroTestSet').getOrElse('none')}"
        vmArg '-Drealworldmc.mapCheck=true'
        programArg '--width'
        programArg '640'
        programArg '--height'
        programArg '480'
    }
}
tasks.named('runMapClientCheck') {
    doFirst { delete layout.projectDirectory.file("run-map-check-${providers.gradleProperty('xaeroTestSet').getOrElse('none')}/map-check-result.txt") }
    doLast {
        def result = layout.projectDirectory.file("run-map-check-${providers.gradleProperty('xaeroTestSet').getOrElse('none')}/map-check-result.txt").asFile
        if (!result.exists() || !result.text.startsWith('PASS:')) throw new GradleException(result.exists() ? result.text : 'Map client check did not finish')
    }
}
tasks.named('runPhotoCheck') {
    doFirst { delete layout.projectDirectory.file('run-photo-check/photo-check-result.txt') }
    doLast {
        def result = layout.projectDirectory.file('run-photo-check/photo-check-result.txt').asFile
        if (!result.exists() || !result.text.startsWith('PASS:')) throw new GradleException(result.exists() ? result.text : 'Photo rendering check did not finish')
    }
}
loom.runs {
    streetWalkingCheck {
        client()
        source sourceSets.clientcheck
        runDir 'run-walking-check'
        vmArg '-Drealworldmc.walkingCheck=true'
        programArg '--width'
        programArg '640'
        programArg '--height'
        programArg '480'
    }
}
tasks.named('runStreetWalkingCheck') {
    dependsOn tasks.named('runGameTest')
    doFirst {
        delete layout.projectDirectory.file('run-walking-check/walking-check-result.txt')
        copy {
            from layout.buildDirectory.dir('run/gameTest/world')
            into layout.projectDirectory.dir('run-walking-check/saves/walking-check')
        }
    }
    doLast {
        def result = layout.projectDirectory.file('run-walking-check/walking-check-result.txt').asFile
        if (!result.exists() || !result.text.startsWith('PASS:')) throw new GradleException(result.exists() ? result.text : 'Street walking check did not finish')
    }
}
