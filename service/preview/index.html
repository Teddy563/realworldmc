<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RealWorldMC Preview</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #9cc3e6; font: 13px system-ui, sans-serif; overflow: hidden; }
  #hud { position: fixed; left: 8px; top: 8px; background: rgba(0,0,0,.55); color: #fff; padding: 6px 10px; border-radius: 6px; }
  #attr { position: fixed; left: 8px; bottom: 6px; color: #fff; text-shadow: 0 0 3px #000; }
</style>
</head>
<body>
<div id="hud">Loading map data…</div>
<div id="attr"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// Renders the same /render/* data the Minecraft mod uses (MC coordinates: x east, y up, z south).
const q = new URLSearchParams(location.search);
const lat = q.get('lat') ?? '44.427454', lon = q.get('lon') ?? '26.087287';
const hud = document.getElementById('hud');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x9cc3e6);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.5, 20000);
const cam = (q.get('cam') ?? '-60,120,120').split(',').map(Number);
camera.position.set(cam[0], cam[1], cam[2]);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 70, 0);
controls.update();
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

function parseTile(buf) {
  const dv = new DataView(buf); let o = 4;
  const n = dv.getInt32(o, true); o += 4;
  const anchor = [dv.getFloat64(o, true), dv.getFloat64(o + 8, true), dv.getFloat64(o + 16, true)]; o += 24;
  const group = new THREE.Group();
  group.position.set(...anchor);
  for (let p = 0; p < n; p++) {
    const vc = dv.getInt32(o, true), tw = dv.getInt32(o + 4, true), th = dv.getInt32(o + 8, true); o += 12;
    const color = [dv.getUint8(o), dv.getUint8(o + 1), dv.getUint8(o + 2)]; o += 4;
    const f = new Float32Array(buf.slice(o, o + vc * 20)); o += vc * 20;
    const pos = new Float32Array(vc * 3), uv = new Float32Array(vc * 2);
    for (let i = 0; i < vc; i++) { pos.set(f.subarray(i * 5, i * 5 + 3), i * 3); uv.set(f.subarray(i * 5 + 3, i * 5 + 5), i * 2); }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
    let mat;
    if (tw > 0) {
      const tex = new THREE.DataTexture(new Uint8Array(buf.slice(o, o + tw * th * 4)), tw, th, THREE.RGBAFormat);
      tex.magFilter = THREE.LinearFilter; tex.needsUpdate = true;
      o += tw * th * 4;
      mat = new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide });
    } else {
      mat = new THREE.MeshBasicMaterial({ color: new THREE.Color(...color.map(c => c / 255)), side: THREE.DoubleSide });
    }
    group.add(new THREE.Mesh(geo, mat));
  }
  return group;
}

let origin, shown = new Map();
async function update() {
  const p = camera.position;
  const sel = await (await fetch(`/render/select?lat=${lat}&lon=${lon}&h=${origin}&x=${p.x}&y=${p.y}&z=${p.z}`)).json();
  document.getElementById('attr').textContent = sel.attribution.includes('Google') ? sel.attribution.join(', ') : ['Google', ...sel.attribution].join(', ');
  const want = new Set(sel.tiles.map(t => t.id));
  await Promise.all(sel.tiles.filter(t => !shown.has(t.id)).map(async t => {
    const buf = await (await fetch(`/render/tile?lat=${lat}&lon=${lon}&h=${origin}&id=${t.id}`)).arrayBuffer();
    const g = parseTile(buf); shown.set(t.id, g);
  }));
  if (!sel.pending) for (const [id, g] of shown) { if (!want.has(id)) { scene.remove(g); shown.delete(id); } }
  for (const id of want) { const g = shown.get(id); if (g && !g.parent) scene.add(g); }
  hud.textContent = `${shown.size} tiles, ${sel.pending} pending · Camera ${p.x.toFixed(0)}, ${p.y.toFixed(0)}, ${p.z.toFixed(0)}`;
  setTimeout(update, sel.pending ? 300 : 1500);
}
(async () => {
  origin = q.get('h') ?? (await (await fetch(`/ground?lat=${lat}&lon=${lon}`)).json()).height;
  update();
})();
(function loop() { renderer.render(scene, camera); requestAnimationFrame(loop); })();
</script>
</body>
</html>
