<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RealWorldMC — Street photos</title>
<style>body{margin:0;background:#15222d;color:#fff;font:16px system-ui}header{padding:16px}h1{font-size:22px;margin:0 0 12px}form{display:flex;gap:12px;flex-wrap:wrap}input,button{font:inherit;padding:8px;border-radius:6px}label{display:flex;gap:6px;align-items:center}#pano{height:65vh;min-height:300px}nav{display:flex;gap:10px;padding:12px}#status{padding:0 16px}button:disabled{opacity:.4}</style>
<header><h1>RealWorldMC · Street photos</h1><form id="location"><label>Latitude <input id="lat" type="number" min="-90" max="90" step="any" required></label><label>Longitude <input id="lng" type="number" min="-180" max="180" step="any" required></label><button id="open" disabled>Find panorama</button></form><p>Drag to look around. Arrow keys move to a connected photo in that direction relative to your view.</p></header>
<div id="pano" aria-label="360-degree street panorama"></div>
<nav aria-label="Move to next photo"><button data-offset="-90" disabled>← Left</button><button data-offset="0" disabled>↑ Forward</button><button data-offset="180" disabled>↓ Back</button><button data-offset="90" disabled>→ Right</button></nav>
<p id="status" role="status">Loading Street View…</p><script type="module" src="/streetview.mjs"></script></html>
